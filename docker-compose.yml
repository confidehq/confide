services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: confide
      POSTGRES_PASSWORD: confide
      POSTGRES_DB: confide
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:                                                                                                                     
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confide"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:                                                                                                                     
      - "8080:8080"
    volumes:
      - /etc/dokploy/traefik/dynamic:/traefik-config
    env_file:
      - .env
    environment:
      CONFIDE_DATABASE_URL: postgresql://confide:confide@postgres:5432/confide
      CONFIDE_RP_ORIGIN: http://localhost:8080                                                                                 
      CONFIDE_CORS_ORIGIN: http://localhost:8080

volumes:
  pgdata:
