services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: confide
      POSTGRES_PASSWORD: confide
      POSTGRES_DB: confide
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confide"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    #image: ghcr.io/phantompunk/confide
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:                                                                                                                     
      - "8080:8080"
    env_file:
      - .env

volumes:
  pgdata:
