services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: confide
      POSTGRES_PASSWORD: confide
      POSTGRES_DB: confide
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confide"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - internal

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      CONFIDE_DATABASE_URL: ${CONFIDE_DATABASE_URL}
      CONFIDE_BIND_ADDR: ${CONFIDE_BIND_ADDR:-:8080}
      CONFIDE_CORS_ORIGIN: ${CONFIDE_CORS_ORIGIN:-http://localhost:3000}
      CONFIDE_HMAC_KEY: ${CONFIDE_HMAC_KEY}
      CONFIDE_RP_ID: ${CONFIDE_RP_ID:-localhost}
      CONFIDE_RP_ORIGIN: ${CONFIDE_RP_ORIGIN:-http://localhost:3000}
      CONFIDE_RP_DISPLAY_NAME: ${CONFIDE_RP_DISPLAY_NAME:-Confide}
      CONFIDE_ENV: ${CONFIDE_ENV:-development}
      CONFIDE_REGISTRATION_OPEN: ${CONFIDE_REGISTRATION_OPEN:-false}
    networks: 
      - internal

  # relay:
  #   image: busybox
  #   command: ["sh", "-c", "echo 'relay: Phase 4' && sleep infinity"]
  #   networks: [external]

  web:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.web
    restart: unless-stopped
    environment:
      ORIGIN: https://${CONFIDE_DOMAIN}
      PUBLIC_API_URL: ""
      BODY_SIZE_LIMIT: 1M
    networks:
      - external

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      CONFIDE_DOMAIN: ${CONFIDE_DOMAIN}
    depends_on:
      - api
      - web
    networks:
      - internal
      - external

volumes:
  pgdata:
  caddy_data:
  caddy_config:

networks:
  internal:
    internal: true
  external:
