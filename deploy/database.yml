services:
  postgres:
    image: postgres:16-alpine
    container_name: confide-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: confide
      POSTGRES_PASSWORD: confide
      POSTGRES_DB: confide
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:                                                                                                                     
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U confide"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
