version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries/"
    schema: "migrations/"
    gen:
      go:
        package: "queries"
        out: "internal/db/queries"
        emit_json_tags: false
        emit_db_tags: false
        emit_prepared_queries: false
        sql_package: "pgx/v5"
